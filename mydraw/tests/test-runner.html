<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyDraw Test Runner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      padding: 2rem;
      line-height: 1.5;
    }
    .test-report {
      max-width: 800px;
      margin: 0 auto;
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }
    .test-header {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .test-header.all-passed {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(16, 185, 129, 0.05));
      border-left: 4px solid #10b981;
    }
    .test-header.has-failures {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.05));
      border-left: 4px solid #ef4444;
    }
    .test-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .summary-stats {
      display: flex;
      gap: 0.75rem;
    }
    .stat-badge {
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
    }
    .stat-badge.total {
      background: #334155;
      color: #cbd5e1;
    }
    .stat-badge.passed {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .stat-badge.clean {
      background: #334155;
      color: #94a3b8;
    }
    .stat-badge.failed {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .test-suite {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #334155;
    }
    .test-suite:last-child {
      border-bottom: none;
    }
    .suite-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #93c5fd;
      margin-bottom: 1rem;
    }
    .test-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .test-item {
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      background: #0f172a;
      border-left: 3px solid transparent;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }
    .test-item.pass {
      border-left-color: #10b981;
    }
    .test-item.fail {
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.08);
    }
    .test-icon {
      font-weight: bold;
      font-size: 1rem;
    }
    .test-item.pass .test-icon {
      color: #10b981;
    }
    .test-item.fail .test-icon {
      color: #ef4444;
    }
    .test-name {
      font-size: 0.95rem;
      color: #e2e8f0;
      flex: 1;
    }
    .test-error {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.75rem;
      background: #18181b;
      color: #fca5a5;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      border-radius: 4px;
      overflow-x: auto;
      white-space: pre-wrap;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div id="test-results"></div>

  <!-- Framework -->
  <script src="test-framework.js"></script>

  <!-- Vendor Libraries -->
  <script src="../vendor/spectral.js"></script>

  <!-- Functional Core (Source Under Test) -->
  <script src="../js/color-bridge.js"></script>
  <script src="../js/geometry.js"></script>

  <!-- Test Specs -->
  <script src="color-bridge.test.js"></script>
  <script src="geometry.test.js"></script>
</body>
</html>
