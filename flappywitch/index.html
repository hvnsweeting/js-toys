<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b3156">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Flappy Witch">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%233e9d55' d='M29 17V6h8l-2 12z'/%3E%3Cpath fill='%23ec8526' stroke='%23a94b1e' stroke-width='2' d='M32 17C14 9 6 22 7 38c1 17 15 22 25 18 10 4 24-1 25-18 1-16-7-29-25-21z'/%3E%3Cpath fill='%23ffe2a3' d='m16 34 10-9 1 12zm21 3 1-12 10 9zM19 43q13 12 26 0l-7 2-6-5-6 5z'/%3E%3C/svg%3E">
  <title>Flappy Witch</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
</head>
<body>
  <main id="stage" aria-label="Flappy Witch game">
    <a id="arcade-back" class="icon-button arcade-back" href="../index.html" aria-label="Back to arcade" title="Back to arcade" aria-hidden="false">◀</a>
    <div id="sky"></div>
    <div id="canvas-host"></div>
    <header id="hud">
      <button id="pause" class="icon-button" aria-label="Pause game" title="Pause game">Ⅱ</button>
      <div id="score-wrap"><span id="score-label">SCORE</span><strong id="score">0</strong><span id="streak-dots" aria-label="Wisps: 0 of 5"><i></i><i></i><i></i><i></i><i></i></span><span id="shield-icon" class="hidden" aria-label="Shield active">✧</span></div>
      <button id="mute" class="icon-button" aria-label="Mute sound" title="Mute sound"><span id="sound-icon" aria-hidden="true"></span></button>
      <button id="music-mute" class="icon-button" aria-label="Mute music" title="Mute music"><span id="music-icon" aria-hidden="true">♫</span></button>
    </header>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="score-pop" aria-hidden="true"></div>
    <div id="best-banner" aria-hidden="true">Best!</div>
    <div id="countdown" class="hidden" aria-live="assertive"></div>
    <section id="title-card" class="card" aria-label="Start game">
      <span class="eyebrow">Halloween night</span>
      <h1>Flappy<br><em>Witch</em></h1>
      <p>Ride your broom through the moonlit gates.</p>
      <button id="start" class="primary">Tap to fly</button>
      <p id="hint" class="hint">Tap anywhere to rise. Find wisps for a second chance.</p>
      <p id="offline-ready" class="offline-ready hidden" aria-live="polite">Ready to play offline</p>
    </section>
    <section id="pause-card" class="card hidden" aria-label="Game paused">
      <span class="eyebrow">A moonlit pause</span>
      <h2>Paused</h2>
      <button id="resume" class="primary">Keep drifting</button>
    </section>
    <section id="over-card" class="card hidden" aria-label="Game over">
      <span class="eyebrow">The candle fades</span>
      <h2>Night's end</h2>
      <div class="results"><div><span>Score</span><strong id="final-score">0</strong></div><div><span>Best</span><strong id="best-score">0</strong></div></div>
      <p id="medal" class="medal">No medal yet</p>
      <button id="again" class="primary">Play again</button>
    </section>
    <div id="play-hint" aria-hidden="true">Tap to lift your broom</div>
    <div id="error" class="card hidden" role="alert"></div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
